name: 雲端測試（訂房網站與特斯拉）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/test.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: 直接讀網頁
        continue-on-error: true
        run: |
          python3 - <<'EOF'
          import re, urllib.request, urllib.error
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          T = {
            "Booking 搜尋": "https://www.booking.com/searchresults.zh-tw.html?ss=%E5%8F%B0%E5%8C%97&checkin=2026-12-24&checkout=2026-12-25&group_adults=2&no_rooms=1&selected_currency=TWD",
            "Booking 飯店頁": "https://www.booking.com/hotel/tw/grand-hyatt-taipei.zh-tw.html?checkin=2026-12-24&checkout=2026-12-25&group_adults=2&selected_currency=TWD",
            "Agoda 首頁": "https://www.agoda.com/zh-tw/",
            "Agoda 搜尋": "https://www.agoda.com/zh-tw/search?city=4951&checkIn=2026-12-24&los=1&rooms=1&adults=2&currency=TWD",
            "Trip.com 飯店列表": "https://tw.trip.com/hotels/list?city=617&checkin=2026/12/24&checkout=2026/12/25&adult=2&curr=TWD",
            "Trip.com 首頁": "https://tw.trip.com/",
            "特斯拉 現車": "https://www.tesla.com/zh_TW/inventory/new/m3",
          }
          for name, url in T.items():
              req = urllib.request.Request(url, headers={"User-Agent": UA, "Accept-Language": "zh-TW,zh;q=0.9", "Accept": "text/html,application/xhtml+xml"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as r:
                      st, h = r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  st, h = e.code, e.read().decode("utf-8", "replace")
              except Exception as e:
                  st, h = 0, repr(e)
              title = (re.search(r"<title[^>]*>([^<]{0,80})", h) or [None, ""])[1].strip()
              prices = re.findall(r"(?:TWD|NT\$)\s?[\d,]{3,}", h)[:5]
              flags = [k for k in ("captcha", "Access Denied", "challenge", "robot", "blocked", "verify") if k.lower() in h.lower()]
              print(f"【{name}】HTTP {st}，{len(h):,} 字元，標題：{title!r}，價格樣本：{prices}，可疑字：{flags}")
          EOF

      - name: 用瀏覽器打開
        continue-on-error: true
        run: |
          for u in \
            "https://www.booking.com/searchresults.zh-tw.html?ss=%E5%8F%B0%E5%8C%97&checkin=2026-12-24&checkout=2026-12-25&group_adults=2&no_rooms=1&selected_currency=TWD" \
            "https://www.agoda.com/zh-tw/search?city=4951&checkIn=2026-12-24&los=1&rooms=1&adults=2&currency=TWD" \
            "https://tw.trip.com/hotels/list?city=617&checkin=2026/12/24&checkout=2026/12/25&adult=2&curr=TWD"; do
            timeout 90 google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=25000 --dump-dom "$u" > p.html 2>/dev/null || true
            echo "【瀏覽器】$(echo "$u" | cut -c9-30)… → $(wc -c < p.html) 字元，標題：$(grep -o '<title[^>]*>[^<]*' p.html | head -1 | sed 's/<title[^>]*>//')"
            echo "   價格樣本：$(grep -oE '(TWD|NT\$)[ ]?[0-9,]{3,}' p.html | head -5 | tr '\n' ' ')"
            echo "   可疑字：$(grep -oiE 'captcha|access denied|challenge|are you a robot|blocked' p.html | sort -u | tr '\n' ' ')"
          done
