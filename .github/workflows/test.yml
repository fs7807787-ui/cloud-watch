name: 雲端測試（PTT 試跑）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/test.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 用現在的文章試跑（不發通知）
        run: PTT_FILE=/tmp/x.json python3 ptt.py --dry
