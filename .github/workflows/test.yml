name: 雲端測試（trivago 價格）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/test.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: trivago
        run: |
          python3 - <<'PYEOF'
          import urllib.robotparser
          rp = urllib.robotparser.RobotFileParser("https://www.trivago.com.tw/robots.txt"); rp.read()
          for path in ["/zh-Hant-TW/srl/%E5%8F%B0%E5%8C%97?search=200-10379", "/graphql", "/api/v1/", "/zh-Hant-TW/odr/"]:
              print("robots", path, rp.can_fetch("*", "https://www.trivago.com.tw" + path))
          import urllib.request
          print(urllib.request.urlopen(urllib.request.Request("https://www.trivago.com.tw/robots.txt", headers={"User-Agent": "Mozilla/5.0"})).read().decode()[:1500])
          PYEOF
          U="https://www.trivago.com.tw/zh-Hant-TW/srl/%E5%8F%B0%E5%8C%97?search=200-10379;dr-20261224-20261225;rc-1-2"
          timeout 120 google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=40000 --dump-dom "$U" > t.html 2>/dev/null || true
          echo "大小 $(wc -c < t.html)"
          echo "價格樣本：$(grep -oE '(NT\$|TWD|\$)[ ]?[0-9,]{3,}' t.html | head -20 | tr '\n' ' ')"
          echo "飯店名稱樣本：$(grep -oE 'data-testid="item-name"[^>]*>[^<]+' t.html | head -8 | sed 's/.*>//' | tr '\n' '|')"
          echo "可疑字：$(grep -oiE 'captcha|access denied|are you a robot|challenge' t.html | sort -u | tr '\n' ' ')"
          grep -oE 'data-testid="[a-z-]+"' t.html | sort | uniq -c | sort -rn | head -25
