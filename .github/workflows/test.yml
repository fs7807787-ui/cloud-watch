name: 雲端測試（PTT 更新時間）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/test.yml", "probe/**"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 probe/star.py
