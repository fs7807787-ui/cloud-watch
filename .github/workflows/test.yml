name: 雲端測試（Trip.com 網頁結構）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/test.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 看 Trip.com 列表頁
        run: |
          python3 - <<'PYEOF'
          import re, json, urllib.request
          from concurrent.futures import ThreadPoolExecutor
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          def probe(cid):
              u = f"https://tw.trip.com/hotels/list?city={cid}&checkin=2026/12/24&checkout=2026/12/25&adult=2&crn=1&curr=TWD"
              try:
                  with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Accept-Language": "zh-TW"}), timeout=40) as r:
                      h = r.read().decode("utf-8", "replace")
              except Exception:
                  return cid, None, None
              t = ""
              for m in re.finditer(r"self\.__next_f\.push\((\[.*?\])\)</script>", h, re.S):
                  try: t += "".join(x for x in json.loads(m.group(1)) if isinstance(x, str))
                  except Exception: pass
              cn = re.search(r'"cityName":"([^"]+)"', t); co = re.search(r'"countryName":"([^"]+)"', t)
              n = len(set(re.findall(r'"hotelId":"(\d+)"', t)))
              return cid, cn.group(1) if cn else None, (co.group(1) if co else None, n)
          ids = list(range(3840, 3860)) + list(range(5580, 5600)) + list(range(6950, 6962)) + list(range(7560, 7580)) + [617, 720, 7203, 7614, 7809, 7810, 7811, 7812, 7524, 7525, 7526, 7527, 7528, 7529, 7530]
          with ThreadPoolExecutor(6) as ex:
              for cid, cn, extra in ex.map(probe, ids):
                  if cn: print(cid, cn, extra)
          PYEOF
