name: 雲端測試（Trip.com 網頁結構）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/test.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 看 Trip.com 列表頁
        run: |
          python3 - <<'PYEOF'
          import re, json, urllib.request
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Accept-Language": "zh-TW,zh;q=0.9"}), timeout=40) as r:
                  return r.read().decode("utf-8", "replace")
          def flight(h):
              t = ""
              for m in re.finditer(r"self\.__next_f\.push\((\[.*?\])\)</script>", h, re.S):
                  try: t += "".join(x for x in json.loads(m.group(1)) if isinstance(x, str))
                  except Exception: pass
              return t
          for d1, d2 in [("2026/12/31", "2027/01/01"), ("2026/12/10", "2026/12/11")]:
              h = get(f"https://tw.trip.com/hotels/list?city=6954&checkin={d1}&checkout={d2}&adult=2&crn=1&curr=TWD&listFilters=16~4*16*4%2C16~5*16*5")
              t = flight(h)
              i = t.find("煙波花時間")
              print(f"\n===== {d1} =====")
              if i < 0:
                  print("沒有這家"); continue
              j = t.rfind('"hotelId"', 0, i)
              block = t[j:j+7000]
              for k in ["name", "price", "displayPrice", "priceExplanation", "deletePrice", "originPrice", "roomName", "bedInfo", "subRoomName", "promotion", "encourage", "tagTitle", "tagContent", "hotelStar"]:
                  for m in re.finditer('"' + k + '":("[^"]{0,120}"|[\\d.]+|\\{[^}]{0,200}\\})', block):
                      print(f"  {k}: {m.group(1)[:160]}")
              ci = h.find("煙波花時間")
              print("  卡片文字：", re.sub(r"<[^>]+>", " | ", h[ci:ci+4000]).replace("\n"," ")[:1200])
          PYEOF
