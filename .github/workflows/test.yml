name: 雲端測試（Trip.com 網頁結構）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/test.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 看 Trip.com 列表頁
        run: |
          python3 - <<'PYEOF'
          import re, json, urllib.request, html as H
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/131.0 Safari/537.36"
          def get(u):
              with urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA, "Accept-Language": "zh-TW,zh;q=0.9"}), timeout=40) as r:
                  return r.read().decode("utf-8", "replace")
          h = get("https://tw.trip.com/hotels/list?city=617&checkin=2026/12/24&checkout=2026/12/25&adult=2&crn=1&curr=TWD")
          i = h.find('class="hotelName"')
          print("=== 第一張飯店卡片 ===")
          print(re.sub(r"\s+", " ", h[max(0, i-2500):i+3500]))
          print("\n=== 卡片數量 ===", h.count('class="hotelName"'))
          names = [H.unescape(x) for x in re.findall(r'class="hotelName"[^>]*>(?:<[^>]+>)*([^<]+)', h)]
          print("飯店名稱：", names[:25])
          for k in ["hotelId", "hotelName", "price", "cityName"]:
              for pat in ['\\"' + k + '\\":', '"' + k + '":']:
                  j = h.find(pat)
                  if j >= 0:
                      print(f"[{k}] {pat} …", h[j:j+260].replace("\n", " "))
                      break
          for cid in [720, 228, 219]:
              hh = get(f"https://tw.trip.com/hotels/list?city={cid}&checkin=2026/12/24&checkout=2026/12/25&adult=2&crn=1&curr=TWD")
              nm = [H.unescape(x) for x in re.findall(r'class="hotelName"[^>]*>(?:<[^>]+>)*([^<]+)', hh)][:3]
              print(f"city={cid} 前 3 家：{nm}")
          PYEOF
