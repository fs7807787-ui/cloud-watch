name: 雲端測試（公開優惠情報來源）

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/test.yml"]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 測情報來源
        run: |
          python3 - <<'PYEOF'
          import re, urllib.request, urllib.error, urllib.robotparser, urllib.parse
          UA = "Mozilla/5.0 (compatible; personal-deal-alert/1.0)"
          T = [
            ("PTT 省錢板 Atom", "https://www.ptt.cc/atom/Lifeismoney.xml"),
            ("PTT 日旅板 Atom", "https://www.ptt.cc/atom/Japan_Travel.xml"),
            ("PTT 國旅板 Atom", "https://www.ptt.cc/atom/Tour-Agency.xml"),
            ("Dcard 省錢板 API", "https://www.dcard.tw/service/api/v2/forums/savemoney/posts?popular=false&limit=30"),
            ("Slickdeals RSS", "https://slickdeals.net/newsearch.php?mode=frontpage&searcharea=deals&searchin=first&rss=1"),
            ("Reddit r/errorfare RSS", "https://www.reddit.com/r/errorfare/new/.rss"),
            ("Secret Flying RSS", "https://www.secretflying.com/feed/"),
            ("Fly4free RSS", "https://www.fly4free.com/feed/"),
            ("Google 新聞 RSS（bug 價）", "https://news.google.com/rss/search?q=bug%E5%83%B9&hl=zh-TW&gl=TW&ceid=TW:zh-Hant"),
          ]
          for name, url in T:
              u = urllib.parse.urlparse(url)
              rp = urllib.robotparser.RobotFileParser(f"{u.scheme}://{u.netloc}/robots.txt")
              try: rp.read(); ok = rp.can_fetch("*", url)
              except Exception: ok = "讀不到"
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA}), timeout=30) as r:
                      st, h = r.status, r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  st, h = e.code, ""
              except Exception as e:
                  st, h = 0, repr(e)
              titles = re.findall(r"<title[^>]*>(?:<!\[CDATA\[)?([^<\]]{4,80})", h)[1:4] or re.findall(r'"title":"([^"]{4,60})"', h)[:3]
              print(f"【{name}】robots：{ok}｜HTTP {st}｜{len(h):,} 字元｜最新標題：{titles}")
          PYEOF
