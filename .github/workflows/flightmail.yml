name: 機票通知轉寄 email

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["flight_mail.py", "mailer.py", ".github/workflows/flightmail.yml"]

permissions:
  contents: write

concurrency:
  group: flightmail
  cancel-in-progress: false

jobs:
  forward:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 取出之前的紀錄
        run: |
          mkdir -p data
          if git fetch --depth=1 origin flightmail 2>/dev/null; then git show origin/flightmail:flightmail.json > data/flightmail.json; fi
      - name: 轉寄新的機票通知
        env:
          NTFY_FLIGHT_TOPIC: ${{ secrets.NTFY_FLIGHT_TOPIC }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 flight_mail.py
      - name: 存回 flightmail 分支
        if: always()
        run: |
          test -s data/flightmail.json || exit 0
          d=$(mktemp -d); cp data/flightmail.json "$d/"; cd "$d"
          git init -q -b flightmail
          git config user.name "flightmail-bot"; git config user.email "flightmail-bot@users.noreply.github.com"
          git add flightmail.json; git commit -qm "機票轉寄紀錄 $(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" flightmail
