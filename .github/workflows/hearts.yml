name: LINE 愛心記錄

on:
  schedule:
    - cron: "3-59/10 * * * *"   # 每 10 分鐘（GitHub 有時會延遲幾分鐘）
  workflow_dispatch:
    inputs:
      force_rank:
        description: "這次也查排行（1＝要）"
        required: false
        default: "0"
  push:
    branches: [main]
    paths: ["hearts.py", ".github/workflows/hearts.yml"]

permissions:
  contents: write

concurrency:
  group: hearts
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 取出之前的紀錄
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show origin/data:hearts.json > data/hearts.json
            echo "使用 data 分支的紀錄"
          else
            echo "第一次執行，使用搬過來的舊紀錄"
          fi

      - name: 記錄愛心數
        env:
          FORCE_RANK: ${{ github.event.inputs.force_rank || (github.event_name == 'push' && '1') || '0' }}
        run: python3 hearts.py

      - name: 存回 data 分支
        if: always()
        run: |
          test -s data/hearts.json || exit 0
          d=$(mktemp -d)
          cp data/hearts.json "$d/hearts.json"
          cd "$d"
          git init -q -b data
          git config user.name "hearts-bot"
          git config user.email "hearts-bot@users.noreply.github.com"
          git add hearts.json
          git commit -qm "愛心紀錄 $(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
