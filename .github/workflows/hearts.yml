name: LINE 愛心記錄

on:
  schedule:
    - cron: "3-59/10 * * * *"   # 每 10 分鐘（GitHub 有時會延遲幾分鐘）
  workflow_dispatch:
    inputs:
      test_ntfy:
        description: "發一則測試通知（1＝要）"
        required: false
        default: "0"
      ranks:
        description: "這次也查排行（1＝要；雲端讀到的是美國排行）"
        required: false
        default: "0"
  push:
    branches: [main]
    paths: ["hearts.py", ".github/workflows/hearts.yml"]

permissions:
  contents: write
  actions: write

concurrency:
  group: hearts
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 取出之前的紀錄
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show origin/data:hearts.json > data/hearts.json
            echo "使用 data 分支的紀錄"
          else
            echo "第一次執行，使用搬過來的舊紀錄"
          fi
          if git fetch --depth=1 origin ranks 2>/dev/null; then
            git show origin/ranks:ranks-phone.json > data/ranks-phone.json 2>/dev/null && echo "讀到手機的台灣排行" || rm -f data/ranks-phone.json
          fi

      - name: 記錄愛心數
        env:
          RANKS: ${{ github.event.inputs.ranks || '0' }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_NTFY: ${{ github.event.inputs.test_ntfy || '0' }}
          FORCE_RANK: ${{ github.event.inputs.ranks || '0' }}
          TW_RANKS_OK: '1'
        run: python3 hearts.py

      - name: 存回 data 分支
        if: always()
        run: |
          test -s data/hearts.json || exit 0
          d=$(mktemp -d)
          cp data/hearts.json "$d/hearts.json"
          cd "$d"
          git init -q -b data
          git config user.name "hearts-bot"
          git config user.email "hearts-bot@users.noreply.github.com"
          git add hearts.json
          git commit -qm "愛心紀錄 $(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data

      - name: 順便啟動 Trip.com（每 30 分鐘）、PTT 與機票 email 轉寄（每 10 分鐘）
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          m=$(date -u +%M); m=$((10#$m % 30))
          if [ "$m" -lt 10 ]; then gh workflow run trip.yml -R "${{ github.repository }}" && echo "已啟動 Trip.com 檢查"; else echo "這次不用"; fi
          gh workflow run ptt.yml -R "${{ github.repository }}" && echo "已啟動 PTT 檢查"
          gh workflow run flightmail.yml -R "${{ github.repository }}" && echo "已啟動機票 email 轉寄"
