name: PTT 優惠情報監控

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["ptt.py", "mailer.py", ".github/workflows/ptt.yml"]

permissions:
  contents: write

concurrency:
  group: ptt
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: 取出之前的紀錄
        run: |
          mkdir -p data
          if git fetch --depth=1 origin ptt 2>/dev/null; then git show origin/ptt:ptt.json > data/ptt.json; fi
      - name: 檢查新文章
        env:
          NTFY_BUG_TOPIC: ${{ secrets.NTFY_BUG_TOPIC }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 ptt.py
      - name: 存回 ptt 分支
        if: always()
        run: |
          test -s data/ptt.json || exit 0
          d=$(mktemp -d); cp data/ptt.json "$d/"; cd "$d"
          git init -q -b ptt
          git config user.name "ptt-bot"; git config user.email "ptt-bot@users.noreply.github.com"
          git add ptt.json; git commit -qm "PTT 紀錄 $(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ptt
