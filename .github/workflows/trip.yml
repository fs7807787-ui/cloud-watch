name: Trip.com bug 價監控

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["trip.py", ".github/workflows/trip.yml"]

permissions:
  contents: write

concurrency:
  group: trip
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: 取出之前的價格紀錄
        run: |
          mkdir -p data
          if git fetch --depth=1 origin trip 2>/dev/null; then git show origin/trip:trip.json > data/trip.json; echo "讀到之前的紀錄"; else echo "第一次執行"; fi
          if git fetch --depth=1 origin official 2>/dev/null; then git show origin/official:tw_official.json > data/tw_official.json; echo "讀到官方星級資料"; fi
      - name: 檢查價格
        env:
          NTFY_BUG_TOPIC: ${{ secrets.NTFY_BUG_TOPIC }}
        run: python3 trip.py
      - name: 存回 trip 分支
        if: always()
        run: |
          test -s data/trip.json || exit 0
          d=$(mktemp -d); cp data/trip.json "$d/"; cd "$d"
          git init -q -b trip
          git config user.name "trip-bot"; git config user.email "trip-bot@users.noreply.github.com"
          git add trip.json; git commit -qm "Trip.com 價格 $(TZ=Asia/Taipei date '+%Y/%m/%d %H:%M')"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" trip
